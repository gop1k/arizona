<svg xmlns="http://www.w3.org/2000/svg" width="400" height="110" viewBox="0 0 400 110">
  <defs>
    <!-- Базовая подложка кнопки -->
    <linearGradient id="btnBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3f7a"/>
      <stop offset="35%" stop-color="#0f2447"/>
      <stop offset="70%" stop-color="#0a1a35"/>
      <stop offset="100%" stop-color="#040d1c"/>
    </linearGradient>

    <!-- Металлическая кромка -->
    <linearGradient id="edgeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7c6f2" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#4a6fa8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1a2f52" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6c8fc0" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Синий проблеск (слева) -->
    <radialGradient id="blueStrobe" cx="18%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3d8bff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#1857d1" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#0a3d91" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#061a3d" stop-opacity="0"/>
    </radialGradient>

    <!-- Красный проблеск (справа) -->
    <radialGradient id="redStrobe" cx="82%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff4455" stop-opacity="1"/>
      <stop offset="40%" stop-color="#c41230" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#7a0018" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3d000c" stop-opacity="0"/>
    </radialGradient>

    <!-- Верхний глянец -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Нижнее затенение -->
    <linearGradient id="bottomShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Внутренний блик сверху -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Фильтры -->
    <filter id="dropShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Клип -->
    <clipPath id="btnClip">
      <rect x="20" y="20" width="360" height="70" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Внешнее свечение мигалки (сине-красное) -->
  <rect x="20" y="20" width="360" height="70" rx="16" ry="16"
        fill="none" stroke="#3d8bff" stroke-width="3" filter="url(#glowFilter)">
    <animate attributeName="stroke"
             values="#3d8bff;#ff4455;#3d8bff;#ff4455;#3d8bff"
             dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="0.85;0.95;0.85;0.95;0.85"
             dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Тень -->
  <rect x="20" y="20" width="360" height="70" rx="16" ry="16"
        fill="#040d1c" filter="url(#dropShadow)"/>

  <!-- Тело кнопки -->
  <rect x="20" y="20" width="360" height="70" rx="16" ry="16"
        fill="url(#btnBase)"/>

  <!-- Проблесковые маячки + глянец + текстура -->
  <g clip-path="url(#btnClip)">
    <!-- Левый синий -->
    <rect x="20" y="20" width="360" height="70" fill="url(#blueStrobe)">
      <animate attributeName="opacity" values="1;0.1;1;0.1;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <!-- Правый красный -->
    <rect x="20" y="20" width="360" height="70" fill="url(#redStrobe)">
      <animate attributeName="opacity" values="0.1;1;0.1;1;0.1" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Верхний глянец -->
    <rect x="20" y="20" width="360" height="38" fill="url(#gloss)"/>
    <!-- Нижнее затенение -->
    <rect x="20" y="55" width="360" height="35" fill="url(#bottomShade)"/>

    <!-- Тонкие сканлайны для текстуры -->
    <g opacity="0.08">
      <line x1="20" y1="42" x2="380" y2="42" stroke="#ffffff"/>
      <line x1="20" y1="46" x2="380" y2="46" stroke="#ffffff"/>
      <line x1="20" y1="50" x2="380" y2="50" stroke="#ffffff"/>
      <line x1="20" y1="54" x2="380" y2="54" stroke="#ffffff"/>
    </g>
  </g>

  <!-- Металлическая кромка -->
  <rect x="20.5" y="20.5" width="359" height="69" rx="15.5" ry="15.5"
        fill="none" stroke="url(#edgeMetal)" stroke-width="1"/>

  <!-- Внутренний блик -->
  <rect x="22" y="22" width="356" height="66" rx="14" ry="14"
        fill="none" stroke="url(#edgeHighlight)" stroke-width="0.8"/>

  <!-- Верхняя декоративная линия -->
  <line x1="38" y1="26" x2="362" y2="26"
        stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8"/>

  <!-- Текст -->
  <text x="200" y="62" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="800"
        letter-spacing="3"
        fill="#ffffff"
        style="paint-order:stroke;stroke:#020a19;stroke-width:1.5px;stroke-linejoin:round">
    ПОДАТЬ ЗАЯВЛЕНИЕ
    <animate attributeName="opacity" values="1;0.88;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- Боковые ромбы-акценты -->
  <g fill="#a7c6f2" opacity="0.75">
    <path d="M32,55 L36,51 L40,55 L36,59 Z"/>
    <path d="M368,55 L364,51 L360,55 L364,59 Z"/>
  </g>
</svg>